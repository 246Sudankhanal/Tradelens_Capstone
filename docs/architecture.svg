<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-label="How a trade gets from the form to the dashboard">
  <rect width="100%" height="100%" fill="#f4eee4"/>
  <text x="28" y="32" font-family="Georgia, Times, serif" font-size="16" fill="#241e18">How a trade gets from the form to the dashboard</text>
  <rect x="28" y="70" width="140" height="64" rx="3" fill="#fffdf8" stroke="#241e18" stroke-width="1.2"/>
  <text x="98.0" y="98.0" text-anchor="middle" font-family="Georgia, Times, serif" font-size="13" fill="#241e18">Browser</text>
  <text x="98.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">PHP pages + JS</text>
  <line x1="168" y1="102" x2="240" y2="102" stroke="#b24c1c" stroke-width="1.4"/>
  <polygon points="239,98 248,102 239,106" fill="#b24c1c"/>
  <text x="208.0" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6e6458">session cookie</text>
  <rect x="248" y="70" width="170" height="64" rx="3" fill="#fffdf8" stroke="#241e18" stroke-width="1.2"/>
  <text x="333.0" y="98.0" text-anchor="middle" font-family="Georgia, Times, serif" font-size="13" fill="#241e18">PHP</text>
  <text x="333.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">pages and api/*.php</text>
  <line x1="418" y1="102" x2="520" y2="102" stroke="#b24c1c" stroke-width="1.4"/>
  <polygon points="519,98 528,102 519,106" fill="#b24c1c"/>
  <text x="473.0" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6e6458">PDO prepared</text>
  <rect x="528" y="70" width="160" height="64" rx="3" fill="#fffdf8" stroke="#241e18" stroke-width="1.2"/>
  <text x="608.0" y="98.0" text-anchor="middle" font-family="Georgia, Times, serif" font-size="13" fill="#241e18">MySQL</text>
  <text x="608.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">journals + trades</text>
  <text x="28" y="168" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">Same app, optional extras</text>
  <rect x="248" y="188" width="170" height="56" rx="3" fill="#fffdf8" stroke="#241e18" stroke-width="1.2"/>
  <text x="333.0" y="212.0" text-anchor="middle" font-family="Georgia, Times, serif" font-size="13" fill="#241e18">CSV import</text>
  <text x="333.0" y="230.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">xlsx / csv → rows</text>
  <rect x="448" y="188" width="170" height="56" rx="3" fill="#fffdf8" stroke="#241e18" stroke-width="1.2"/>
  <text x="533.0" y="212.0" text-anchor="middle" font-family="Georgia, Times, serif" font-size="13" fill="#241e18">MetaApi</text>
  <text x="533.0" y="230.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">closed deals only</text>
  <rect x="648" y="188" width="184" height="56" rx="3" fill="#fffdf8" stroke="#241e18" stroke-width="1.2"/>
  <text x="740.0" y="212.0" text-anchor="middle" font-family="Georgia, Times, serif" font-size="13" fill="#241e18">OpenRouter</text>
  <text x="740.0" y="230.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">your journal stats</text>
  <line x1="333" y1="134" x2="333" y2="180" stroke="#b24c1c" stroke-width="1.4"/>
  <polygon points="329,179 333,188 337,179" fill="#b24c1c"/>
  <text x="28" y="280" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">Not a broker. Chat only sees the signed-in user’s aggregates. Passwords are bcrypt; queries use PDO.</text>
  <text x="28" y="302" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6e6458">Google login stays off until oauth.php has keys.</text>
</svg>
